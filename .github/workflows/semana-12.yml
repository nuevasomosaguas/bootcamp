# Corrige el proyecto de replicación de la semana 12 con cada push o pull request que lo cambie.
name: Semana 12
on:
  push:
    paths: ["semana-12/comunidad.txt", "semana-12/limpiar.sh", "semana-12/proyecto.jl", "semana-12/informe.typ"]
  pull_request:
    paths: ["semana-12/comunidad.txt", "semana-12/limpiar.sh", "semana-12/proyecto.jl", "semana-12/informe.typ"]
  workflow_dispatch:
jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.15"
      - uses: actions/cache@v4   # los microdatos de defunciones de 2024, para no pedirlos al INE en cada push
        with:
          path: semana-09/datos/datos_2024.zip
          key: defunciones-2024-33682a2f   # la suma SHA-256 del zip, que el test comprueba
      - run: julia --project=semana-12 -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=semana-12 --depwarn=yes semana-12/test_semana12.jl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-semana-12
          path: semana-12/resultados/
          if-no-files-found: ignore

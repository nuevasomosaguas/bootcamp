# Corrige la entrega de la semana 7 con cada push o pull request que cambie el script.
name: Semana 7
on:
  push:
    paths: ["semana-07/laboratorio_semana7.jl"]
  pull_request:
    paths: ["semana-07/laboratorio_semana7.jl"]
  workflow_dispatch:
jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - run: julia --project=semana-07 -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=semana-07 --depwarn=yes semana-07/test_semana7.jl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-semana-07
          path: semana-07/resultados/
          if-no-files-found: ignore

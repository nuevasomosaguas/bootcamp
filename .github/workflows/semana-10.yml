# Corrige la entrega de la semana 10 con cada push o pull request que cambie el script.
name: Semana 10
on:
  push:
    paths: ["semana-10/laboratorio_semana10.jl"]
  pull_request:
    paths: ["semana-10/laboratorio_semana10.jl"]
  workflow_dispatch:
jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - run: julia --project=semana-10 -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=semana-10 --depwarn=yes semana-10/test_semana10.jl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-semana-10
          path: semana-10/resultados/
          if-no-files-found: ignore

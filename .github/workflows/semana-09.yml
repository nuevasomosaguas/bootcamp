# Corrige la entrega de la semana 9 con cada push o pull request que cambie el script o la ficha.
name: Semana 9
on:
  push:
    paths: ["semana-09/laboratorio_semana9.jl", "semana-09/ficha.typ"]
  pull_request:
    paths: ["semana-09/laboratorio_semana9.jl", "semana-09/ficha.typ"]
  workflow_dispatch:
jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.15"
      - uses: actions/cache@v4   # los microdatos de defunciones de 2024, para no pedirlos al INE en cada push
        with:
          path: semana-09/datos/datos_2024.zip
          key: defunciones-2024-33682a2f   # la suma SHA-256 del zip, que el test comprueba
      - name: Descargar los microdatos del INE, si no están en la caché
        # Antes del test: si el servidor del INE falla, falla este paso, no la entrega
        run: |
          [ -f semana-09/datos/datos_2024.zip ] ||
            curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 -o semana-09/datos/datos_2024.zip \
              https://www.ine.es/ftp/microdatos/mnp_defun/datos_2024.zip
      - run: julia --project=semana-09 -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=semana-09 --depwarn=yes semana-09/test_semana9.jl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-semana-09
          path: semana-09/resultados/
          if-no-files-found: ignore

# Corrige la entrega de la semana 4 y el proyecto de cierre de la fase I con cada push o
# pull request que cambie uno de sus scripts.
name: Semana 4
on:
  push:
    paths: ["semana-04/laboratorio_semana4.jl", "semana-04/limpiar.sh", "semana-04/proyecto.jl"]
  pull_request:
    paths: ["semana-04/laboratorio_semana4.jl", "semana-04/limpiar.sh", "semana-04/proyecto.jl"]
  workflow_dispatch:
jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - uses: actions/cache@v4   # los 77 MB de la EES 2022, para no pedirlos al INE en cada push
        with:
          path: semana-04/datos/datos_2022.zip
          key: ees-2022-c52b716c   # la suma SHA-256 del zip, que el test comprueba
      - run: julia --project=semana-04 -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=semana-04 --depwarn=yes semana-04/test_semana4.jl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-semana-04
          path: semana-04/resultados/
          if-no-files-found: ignore

# Corrige la entrega de la semana 2 con cada push o pull request que cambie el script.
name: Semana 2
on:
  push:
    paths: ["semana-02/laboratorio_semana2.jl", "semana-02/flujo.sh"]
  pull_request:
    paths: ["semana-02/laboratorio_semana2.jl", "semana-02/flujo.sh"]
  workflow_dispatch:
jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - run: julia --project=semana-02 -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=semana-02 --depwarn=yes semana-02/test_semana2.jl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-semana-02
          path: semana-02/resultados/
          if-no-files-found: ignore
